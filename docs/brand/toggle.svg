<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-od" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14161A" />
      <stop offset="100%" stop-color="#08090C" />
    </linearGradient>

    <!-- Brushed Aluminum Bezel -->
    <linearGradient id="metal-bezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B5563" />
      <stop offset="50%" stop-color="#1F2937" />
      <stop offset="100%" stop-color="#374151" />
    </linearGradient>

    <!-- Amber Neon Tube Glow -->
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="50%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#FFEB3B" />
    </linearGradient>

    <filter id="od-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-od)" stroke="#232832" stroke-width="3" />

  <!-- Industrial Heavy Faceplate Inset -->
  <rect x="80" y="80" width="352" height="352" rx="36" fill="#101216" stroke="url(#metal-bezel)" stroke-width="4" />
  
  <!-- Corner Industrial Bolts -->
  <circle cx="112" cy="112" r="8" fill="#1F2937" stroke="#4B5563" stroke-width="2" />
  <circle cx="400" cy="112" r="8" fill="#1F2937" stroke="#4B5563" stroke-width="2" />
  <circle cx="112" cy="400" r="8" fill="#1F2937" stroke="#4B5563" stroke-width="2" />
  <circle cx="400" cy="400" r="8" fill="#1F2937" stroke="#4B5563" stroke-width="2" />

  <!-- Overdrive Curved Level Arc / Meter -->
  <path d="M 140 270 A 130 130 0 0 1 372 270" fill="none" stroke="#262E3B" stroke-width="14" stroke-linecap="round" />
  <path d="M 140 270 A 130 130 0 0 1 320 156" fill="none" stroke="url(#amber-glow)" stroke-width="14" stroke-linecap="round" filter="url(#od-filter)" />

  <!-- Center Heavy Aircraft Toggle / Knurled Knob -->
  <circle cx="256" cy="280" r="76" fill="#1A1E24" stroke="#374151" stroke-width="5" />
  <circle cx="256" cy="280" r="62" fill="#0D0E11" />
  
  <!-- Toggle Switch Needle / Indicator pointing in Overdrive position -->
  <line x1="256" y1="280" x2="310" y2="175" stroke="#FF9800" stroke-width="8" stroke-linecap="round" filter="url(#od-filter)" />
  <circle cx="256" cy="280" r="16" fill="#FF5722" />

  <!-- Label Plates: "NORM" and "BOOST" -->
  <text x="146" y="306" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#64748B">IDLE</text>
  <text x="330" y="306" font-family="ui-monospace, monospace" font-size="12" font-weight="800" fill="#FF9800">DRIVE</text>
</svg>
