<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-sl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#020306" />
    </linearGradient>

    <!-- Speed Streamline Gradient -->
    <linearGradient id="stream-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFA3" stop-opacity="0" />
      <stop offset="40%" stop-color="#00F5FF" stop-opacity="0.8" />
      <stop offset="85%" stop-color="#00FFA3" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="stream-azure" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0" />
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="1" />
    </linearGradient>

    <filter id="sl-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-sl)" stroke="#151D2A" stroke-width="3" />

  <!-- Wind Tunnel Grid Horizon -->
  <g opacity="0.08" stroke="#00F5FF" stroke-width="1">
    <line x1="60" y1="256" x2="452" y2="256" />
    <line x1="60" y1="310" x2="452" y2="310" />
    <line x1="60" y1="360" x2="452" y2="360" />
  </g>

  <!-- Aerodynamic Streamlines wrapping smoothly around an invisible zero-drag body -->
  <g filter="url(#sl-glow)">
    <!-- Streamline 1 (Top envelope) -->
    <path d="M 60 170 
             C 170 170, 220 130, 290 130 
             C 360 130, 400 170, 452 170" 
          fill="none" stroke="url(#stream-azure)" stroke-width="4" stroke-linecap="round" />

    <!-- Streamline 2 (Core vortex - fast, bright) -->
    <path d="M 80 220 
             C 180 220, 220 190, 280 190 
             C 350 190, 390 220, 452 220" 
          fill="none" stroke="url(#stream-cyan)" stroke-width="7" stroke-linecap="round" />

    <!-- Streamline 3 (Center spine - razor sharp) -->
    <path d="M 120 256 
             C 210 256, 240 256, 310 256 
             C 380 256, 420 256, 452 256" 
          fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

    <!-- Streamline 4 (Lower vortex) -->
    <path d="M 80 292 
             C 180 292, 220 322, 280 322 
             C 350 322, 390 292, 452 292" 
          fill="none" stroke="url(#stream-cyan)" stroke-width="7" stroke-linecap="round" />

    <!-- Streamline 5 (Bottom envelope) -->
    <path d="M 60 342 
             C 170 342, 220 382, 290 382 
             C 360 382, 400 342, 452 342" 
          fill="none" stroke="url(#stream-azure)" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
